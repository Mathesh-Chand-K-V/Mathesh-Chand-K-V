<svg width="760" height="200" viewBox="0 0 760 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e14"/>
      <stop offset="100%" stop-color="#0d1520"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00F7FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00F7FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00F7FF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect x="0" y="0" width="760" height="200" rx="10"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="760" height="200" fill="url(#bg)"/>

    <!-- scanline sweep -->
    <rect x="0" y="0" width="6" height="200" fill="url(#glow)" opacity="0.6">
      <animate attributeName="x" values="-20;780;-20" dur="6s" repeatCount="indefinite"/>
    </rect>

    <!-- title bar -->
    <rect x="0" y="0" width="760" height="28" fill="#111823"/>
    <circle cx="18" cy="14" r="5" fill="#ff5f56"/>
    <circle cx="36" cy="14" r="5" fill="#ffbd2e"/>
    <circle cx="54" cy="14" r="5" fill="#27c93f"/>
    <text x="380" y="18" fill="#5a6b7d" font-family="Consolas,Menlo,monospace" font-size="12" text-anchor="middle">dev@local: ~/jarvis</text>

    <!-- terminal text, typed line by line -->
    <text x="24" y="60" font-family="Consolas,Menlo,monospace" font-size="15" fill="#00F7FF">
      <tspan>$ status ? </tspan>
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.01;0.05;1" dur="7s" repeatCount="indefinite"/>
    </text>


    <text x="24" y="100" font-family="Consolas,Menlo,monospace" font-size="15" fill="#7ee787">
      <tspan>&gt; JARVIS — local AI assistant (Ollama · FastAPI · RAG) [Done]</tspan>

      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.48;0.52;1" dur="7s" repeatCount="indefinite"/>
    </text>

    <text x="24" y="126" font-family="Consolas,Menlo,monospace" font-size="15" fill="#7ee787">
      <tspan>&gt; ERP + AI Integration Platform [in progress]</tspan>
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.62;0.66;1" dur="7s" repeatCount="indefinite"/>
    </text>

    <!-- blinking cursor -->
    <rect x="24" y="176" width="9" height="16" fill="#00F7FF">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.51;1" dur="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.78;0.80;1" dur="9s" repeatCount="indefinite" additive="sum"/>
    </rect>
  </g>

  <rect x="0.5" y="0.5" width="759" height="199" rx="10" fill="none" stroke="#1c2733" stroke-width="1"/>
</svg>

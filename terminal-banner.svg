
<svg width="760" height="200" viewBox="0 0 760 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e14"/>
      <stop offset="100%" stop-color="#0d1520"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00F7FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00F7FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00F7FF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip">
      <rect x="0" y="0" width="760" height="200" rx="10"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="760" height="200" fill="url(#bg)"/>

    <!-- Animated scanline -->
    <rect x="0" y="0" width="6" height="200"
          fill="url(#glow)" opacity="0.6">
      <animate attributeName="x"
               values="-20;780;-20"
               dur="6s"
               repeatCount="indefinite"/>
    </rect>

    <!-- Terminal title bar -->
    <rect x="0" y="0" width="760" height="28" fill="#111823"/>
    <circle cx="18" cy="14" r="5" fill="#ff5f56"/>
    <circle cx="36" cy="14" r="5" fill="#ffbd2e"/>
    <circle cx="54" cy="14" r="5" fill="#27c93f"/>

    <text x="380" y="18"
          fill="#5a6b7d"
          font-family="Consolas,Menlo,monospace"
          font-size="12"
          text-anchor="middle">
      mathesh@github: ~/projects
    </text>

    <!-- Command 1 -->
    <text x="24" y="57"
          font-family="Consolas,Menlo,monospace"
          font-size="14"
          fill="#00F7FF">
      $ whoami
      <animate attributeName="opacity"
               values="0;0;1;1"
               keyTimes="0;0.03;0.06;1"
               dur="10s"
               repeatCount="indefinite"/>
    </text>

    <text x="24" y="78"
          font-family="Consolas,Menlo,monospace"
          font-size="13"
          fill="#7ee787">
      &gt; Mathesh Chand K V | AI/ML · Cybersecurity
      <animate attributeName="opacity"
               values="0;0;1;1"
               keyTimes="0;0.10;0.13;1"
               dur="10s"
               repeatCount="indefinite"/>
    </text>

    <!-- Command 2 -->
    <text x="24" y="108"
          font-family="Consolas,Menlo,monospace"
          font-size="14"
          fill="#00F7FF">
      $ projects --status
      <animate attributeName="opacity"
               values="0;0;1;1"
               keyTimes="0;0.22;0.25;1"
               dur="10s"
               repeatCount="indefinite"/>
    </text>

    <text x="24" y="130"
          font-family="Consolas,Menlo,monospace"
          font-size="13"
          fill="#7ee787">
      &gt; JARVIS — Local AI Assistant [Complete]
      <animate attributeName="opacity"
               values="0;0;1;1"
               keyTimes="0;0.32;0.35;1"
               dur="10s"
               repeatCount="indefinite"/>
    </text>

    <text x="24" y="151"
          font-family="Consolas,Menlo,monospace"
          font-size="13"
          fill="#7ee787">
      &gt; Vector-Borne Risk Monitoring [Published]
      <animate attributeName="opacity"
               values="0;0;1;1"
               keyTimes="0;0.43;0.46;1"
               dur="10s"
               repeatCount="indefinite"/>
    </text>

    <text x="24" y="172"
          font-family="Consolas,Menlo,monospace"
          font-size="13"
          fill="#7ee787">
      &gt; Smart OCR · Cybersecurity Projects
      <animate attributeName="opacity"
               values="0;0;1;1"
               keyTimes="0;0.54;0.57;1"
               dur="10s"
               repeatCount="indefinite"/>
    </text>

    <!-- Blinking cursor -->
    <rect x="24" y="181" width="9" height="13" fill="#00F7FF">
      <animate attributeName="opacity"
               values="1;1;0;0"
               keyTimes="0;0.5;0.51;1"
               dur="1s"
               repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Outer border -->
  <rect x="0.5" y="0.5"
        width="759" height="199"
        rx="10"
        fill="none"
        stroke="#1c2733"
        stroke-width="1"/>
</svg>
